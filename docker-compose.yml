version: '3.8'

services:
  didi-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: didi-workbench
    ports:
      - "8501:8501"
    volumes:
      # Mount local processed data directory (database + embeddings) read-only
      - ./data:/app/data:ro
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
