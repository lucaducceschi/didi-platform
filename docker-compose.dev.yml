# Local development database. The Streamlit demo's container is in docker-compose.yml.
name: didi-dev

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: didi
      POSTGRES_PASSWORD: didi_dev
      POSTGRES_DB: didi
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - didi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U didi -d didi"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  didi_pgdata:
